<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | Purificá</title>

    <link rel="icon" href="assets/images/favicon.ico">

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/catalogo.css">
    <link rel="stylesheet" href="assets/css/catalogo-sidebar.css">
    <link rel="stylesheet" href="assets/css/catalogo-products.css">
    <link rel="stylesheet" href="assets/css/cta-catalogo.css">
    <link rel="stylesheet" href="assets/css/footer.css">
    <link rel="stylesheet" href="assets/css/responsive.css">

</head>

<body>

<div id="navbar"></div>

<main>

<section class="catalog-page">

    <div class="container">

        <div class="breadcrumb">

            <a href="index.html">

                Home

            </a>

            <span>/</span>

            <p>

                Catálogo

            </p>

        </div>

        <div class="catalog-layout">

            <section class="catalog-banner">

                <div class="catalog-cta">

                    <div class="catalog-cta-icon">

                        <img
                            src="assets/images/icons/whatsapp.svg"
                            alt="WhatsApp"
                        >

                    </div>

                    <div class="catalog-cta-text">

                        <h2>

                            Precisa de ajuda para escolher?

                        </h2>

                        <p>

                            Nossa equipe está pronta para ajudar você a encontrar
                            o purificador ideal para sua casa ou empresa.

                        </p>

                    </div>

                    <a
                        href="https://wa.me/5511999999999"
                        target="_blank"
                        class="catalog-cta-button"
                    >

                        <img
                            src="assets/images/icons/whatsapp.svg"
                            alt="WhatsApp"
                        >

                        Fale no WhatsApp

                    </a>

                </div>

            </section>

            <aside class="sidebar">

                <h3>

                    Filtros

                </h3>

                <div class="filter-group">

                    <h4>

                        Categorias

                    </h4>

                    <label>

                        <input
                            type="checkbox"
                            value="Purificadores"
                        >

                        Purificadores

                    </label>

                    <label>

                        <input
                            type="checkbox"
                            value="Bebedouros"
                        >

                        Bebedouros

                    </label>

                    <label>

                        <input
                            type="checkbox"
                            value="Filtros"
                        >

                        Filtros

                    </label>

                    <label>

                        <input
                            type="checkbox"
                            value="Refis"
                        >

                        Refis

                    </label>

                    <label>

                        <input
                            type="checkbox"
                            value="Torneiras"
                        >

                        Torneiras

                    </label>

                </div>

                <div class="filter-group">

                    <h4>

                        Marca

                    </h4>

                    <label>

                        <input
                            type="checkbox"
                            value="Purificá"
                        >

                        Purificá

                    </label>

                    <label>

                        <input
                            type="checkbox"
                            value="IBBL"
                        >

                        IBBL

                    </label>

                    <label>

                        <input
                            type="checkbox"
                            value="Lorenzetti"
                        >

                        Lorenzetti

                    </label>

                </div>

                <div class="filter-group">

                    <h4>

                        Faixa de preço

                    </h4>

                    <input
                        id="price-filter"
                        type="range"
                        min="0"
                        max="5000"
                        value="5000"
                    >

                    <p id="price-value">

                        Até R$ 5.000,00

                    </p>

                </div>

            </aside>

            <section class="catalog-content">

                <div class="catalog-header">

                    <div>

                        <h2>

                            Todos os Produtos

                        </h2>

                        <p id="products-count">

                            0 produtos encontrados

                        </p>

                    </div>

                    <div class="catalog-sort">

                        <p>

                            Ordenar por

                        </p>

                        <button class="sort-toggle">

                            <span>

                                Relevância

                            </span>

                            <img
                                src="assets/images/icons/chevron.svg"
                                alt="Abrir"
                            >

                        </button>

                        <div class="sort-menu">

                            <button
                                class="active"
                                data-sort="relevance"
                            >

                                Relevância

                            </button>

                            <button data-sort="popular">

                                Mais vendidos

                            </button>

                            <button data-sort="recent">

                                Mais recentes

                            </button>

                            <button data-sort="discount">

                                Maior desconto

                            </button>

                            <button data-sort="price-asc">

                                Menor preço

                            </button>

                            <button data-sort="price-desc">

                                Maior preço

                            </button>

                            <button data-sort="name-asc">

                                Nome A-Z

                            </button>

                            <button data-sort="name-desc">

                                Nome Z-A

                            </button>

                        </div>

                    </div>

                    <button class="filters-toggle">

                        <img
                            src="assets/images/icons/filter.svg"
                            alt="Filtros"
                        >

                        <span>

                            Filtros

                        </span>

                    </button>

                </div>

                <div class="products-grid">

                                    </div>

            </section>

        </div>

    </div>

</section>

</main>

<div id="footer"></div>

<a
    href="https://wa.me/5511999999999"
    class="whatsapp-floating"
    target="_blank"
    aria-label="WhatsApp"
>

    <img
        src="assets/images/icons/whatsapp.svg"
        alt="WhatsApp"
    >

</a>

<script src="assets/js/app.js"></script>

<script src="assets/js/navbar.js"></script>

<script src="assets/js/footer.js"></script>

<script src="assets/js/catalogo.js"></script>

<script src="assets/js/sort.js"></script>

<script src="assets/js/filters.js"></script>

<script src="assets/js/effect.js"></script>

</body>

</html>
